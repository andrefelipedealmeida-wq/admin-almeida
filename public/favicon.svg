<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="500" fill="#000000"/>
  
  <!-- Green Outer Box Frame -->
  <rect x="110" y="30" width="280" height="350" fill="none" stroke="#00aa00" stroke-width="6"/>
  
  <!-- Monogram AA in Green -->
  <g fill="none" stroke="#00aa00" stroke-linecap="square">
    <!-- Back 'A' (Thin serif outline) -->
    <path d="M180,280 L220,110 L260,280" stroke-width="4"/>
    <line x1="192" y1="230" x2="248" y2="230" stroke-width="4"/>
    
    <!-- Front 'A' (Bolder green serif) -->
    <path d="M220,330 L260,60 L330,330" stroke-width="14" stroke-linejoin="round"/>
    <line x1="235" y1="280" x2="310" y2="280" stroke-width="12"/>
  </g>
  
  <!-- Typography ALMEIDA ADVOCACIA -->
  <text x="250" y="420" font-family="'Cambria', 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="12">ALMEIDA</text>
  <text x="250" y="460" font-family="'Cambria', 'Times New Roman', serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="14">ADVOCACIA</text>
</svg>
