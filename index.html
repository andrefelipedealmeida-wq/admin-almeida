<!doctype html>
<html lang="pt-BR" class="bg-black text-neutral-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Almeida Advocacia | Escritório Jurídico Especializado</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#199300" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Almeida Advocacia" />
    <!-- Favicons & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/imagens/logo.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/imagens/logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18123913588"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'AW-18123913588');

      window.reportWhatsAppClick = function() {
        if (typeof gtag === 'function') {
          gtag('event', 'conversion', {
            'send_to': 'AW-18123913588/UCLJCLf8zu0cEPTyk8JD'
          });
        }
      };
    </script>
  </head>
  <body class="bg-black text-neutral-100 min-h-screen">
    <div id="root">
      <!-- Fallback display before React mounts or if script load encounters temporary error -->
      <div style="min-height: 100vh; background-color: #000000; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; padding: 20px; text-align: center;">
        <div style="margin-bottom: 24px; display: flex; align-items: center; gap: 12px;">
          <img src="/imagens/logo.png" alt="Almeida Advocacia" style="width: 48px; height: 48px; object-fit: contain;" onerror="this.style.display='none'" />
          <div style="display: flex; flex-direction: column; text-align: left;">
            <span style="font-size: 18px; font-weight: 900; letter-spacing: 0.25em; color: #ffffff;">ALMEIDA</span>
            <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.28em; color: #10b981; margin-top: 4px;">ADVOCACIA</span>
          </div>
        </div>
        <div style="width: 36px; height: 36px; border: 3px solid rgba(16, 185, 129, 0.2); border-top-color: #10b981; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
        <style>
          @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
        <p style="color: #a3a3a3; font-size: 14px; margin-bottom: 12px;">Carregando portal Almeida Advocacia...</p>
        <noscript>
          <p style="color: #ef4444; font-size: 14px; margin-top: 10px;">É necessário ativar o JavaScript no seu navegador para utilizar o sistema.</p>
        </noscript>
        <button id="manual-reload-btn" onclick="if(window.navigator && navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(regs => {for(let r of regs) r.unregister();});} if('caches' in window){caches.keys().then(names => {for(let name of names) caches.delete(name);});} window.location.reload();" style="display: none; margin-top: 16px; padding: 10px 20px; background-color: #10b981; color: #ffffff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; box-shadow: 0 4px 12px rgba(16,185,129,0.3);">
          Recarregar Portal
        </button>
        <script>
          setTimeout(function() {
            var btn = document.getElementById('manual-reload-btn');
            if (btn) btn.style.display = 'inline-block';
          }, 5000);
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
